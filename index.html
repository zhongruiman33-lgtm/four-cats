<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little cat</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 42%, #fffcf6, #eee8de); }
  button { position: relative; width: 260px; height: 290px; padding: 0; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 1px solid #b9ac99; outline-offset: 12px; border-radius: 45%; }
  svg { width: 100%; height: 100%; overflow: visible; }
  .cat { transform-origin: 130px 248px; animation: breathe 4s ease-in-out infinite; }
  .head { transform: rotate(var(--tilt, 0deg)); transform-origin: 130px 151px; transition: transform .45s cubic-bezier(.2,.7,.3,1.3); }
  .eyes { transform-origin: 130px 125px; transition: transform .25s ease, opacity .2s; }
  .bounce { transform-origin: 130px 248px; }
  .blink { transform-origin: 130px 125px; }
  .ear-outline, .ear-insides { transition: d .3s ease-out; }
  .pupils { transition: transform .12s ease-out; }
  .sleep-eyes, .happy-eyes, .mouth-oh { opacity: 0; transition: opacity .2s; }
  .mouth { transition: opacity .2s; }
  [data-state="surprised"] .head { transform: translateY(-5px) rotate(-3deg); }
  [data-state="surprised"] .eyes { transform: scaleY(1.35); }
  [data-state="surprised"] .mouth { opacity: 0; }
  [data-state="surprised"] .mouth-oh { opacity: 1; }
  [data-state="asleep"] .cat { animation-duration: 6s; }
  [data-state="asleep"] .head { transform: translateY(5px) rotate(4deg); }
  [data-state="asleep"] .eyes { transform: scaleY(.05); opacity: 0; }
  [data-state="asleep"] .sleep-eyes { opacity: 1; }
  [data-state="happy"] .head { transform: translateY(-2px) rotate(-4deg); }
  [data-state="happy"] .eyes, [data-state="yawning"] .eyes { opacity: 0; }
  [data-state="happy"] .happy-eyes, [data-state="yawning"] .sleep-eyes { opacity: 1; }
  [data-state="yawning"] .head { transform: translateY(-3px) rotate(2deg); }
  [data-state="yawning"] .mouth { opacity: 0; }
  [data-state="yawning"] .mouth-oh { opacity: 1; transform: scale(1.6, 2.4); }
  .mouth-oh { transform-origin: 130px 148px; transition: transform .5s ease, opacity .25s; }
  .happy-eyes { transition: opacity .25s; }
  button { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .zzz { opacity: 0; fill: #a79d90; font: 15px Georgia, serif; letter-spacing: 3px; }
  [data-state="asleep"] .zzz { animation: drift 3s ease-in-out infinite; }
  .heart { opacity: 0; transform-origin: 193px 67px; fill: #d59c9a; }
  @keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.012,1.025); } }
  @keyframes drift { 0%,100% { opacity: 0; transform: translateY(3px); } 35%,65% { opacity: .8; } 90% { transform: translateY(-13px); } }
  @media (prefers-reduced-motion: reduce) { .cat { animation: none; } .head, .eyes, .pupils, .ear-outline, .ear-insides { transition: none; } }
  .cats { display: flex; align-items: center; justify-content: center; gap: 24px; }
  .cats > button { flex-shrink: 0; }
  @media (max-width: 1150px) { .cats { display: grid; grid-template-columns: repeat(2, 260px); gap: 0 24px; } }
  @media (max-width: 560px) { .cats { grid-template-columns: 260px; gap: 0; } }

  .cat-label { display: block; position: absolute; top: 276px; width: 100%; color: #9a8c7b; font: 10px/1.5 Georgia, serif; letter-spacing: .15em; pointer-events: none; }
  button > svg { position: absolute; inset: 0; transform-origin: 50% 76%; }
  .belly-pose > g { transform: rotate(-16deg); transform-origin: 130px 178px; }
  button > .belly-pose { opacity: 0; pointer-events: none; }
  button[data-rolling="true"] .cat { animation-play-state: paused; }
  .belly-paw { transform-box: fill-box; transform-origin: center; }
  .belly-tail { transform-origin: 167px 196px; }
  [data-pose="belly"] .belly-paw { animation: paw-wiggle var(--wiggle-speed, 1.2s) ease-in-out infinite alternate; }
  [data-pose="belly"] .belly-tail { animation: tail-wiggle 1.5s ease-in-out infinite alternate; }
  @keyframes paw-wiggle { to { transform: rotate(var(--wiggle, 8deg)) translateY(-2px); } }
  @keyframes tail-wiggle { to { transform: rotate(var(--wiggle, 8deg)); } }
  @media (prefers-reduced-motion: reduce) { .belly-paw, .belly-tail { animation: none !important; } }
</style>

<script>
  // IDs follow the original visual order: calico, white, tabby, tabby.
  // Times are milliseconds; eye/ear ranges are SVG pixels; tilt is degrees.
  const personalities = {
    cat:     { role: 'alert', blink: 3400, sleep: 14000, eye: 3.8, ear: 3.4, tilt: 3, near: 190, startle: 0, bounce: .025, speed: 380, response: 60, curiosity: .85, breathe: 4.2 },
    'cat-2': { role: 'timid', blink: 2800, sleep: 7000, eye: 2.6, ear: 1.5, tilt: 2, near: 125, startle: 65, bounce: .018, speed: 300, response: 0, curiosity: .5, breathe: 4.8 },
    'cat-3': { role: 'curious', blink: 2400, sleep: 16000, eye: 3.4, ear: 2.7, tilt: 5, near: 210, startle: 0, bounce: .035, speed: 420, response: 180, curiosity: .8, breathe: 3.8 },
    'cat-4': { role: 'bold', blink: 3100, sleep: 20000, eye: 3.6, ear: 3, tilt: 5.5, near: 230, startle: 0, bounce: .045, speed: 360, response: 90, curiosity: .9, breathe: 3.6 }
  };
  // Edit these four names here. Trust is session-only; all probabilities are 0–1.
  const catConfig = {
    cat: { name: 'CAT_1', trust: .35, boldness: .4, playfulness: .45, bellyRollChance: .42, interactionCount: 0 },
    'cat-2': { name: 'CAT_2', trust: .08, boldness: .12, playfulness: .25, bellyRollChance: .15, interactionCount: 0 },
    'cat-3': { name: 'CAT_3', trust: .55, boldness: .7, playfulness: .8, bellyRollChance: .7, interactionCount: 0 },
    'cat-4': { name: 'CAT_4', trust: .75, boldness: 1, playfulness: 1, bellyRollChance: .94, interactionCount: 0 }
  };
  const rollSettings = { holdMs: 1100, clicks: 3, clickWindowMs: 2400, maxMovePx: 12, cooldownMs: 6500, stayMs: 3200 };
  const companions = [];
  let lastNotice = -Infinity;
  function notify(source, kind) {
    if (Date.now() - lastNotice < 1800) return;
    const a = source.getBoundingClientRect();
    const nearby = companions.filter(c => c.cat !== source && c.available())
      .map(c => ({ c, distance: Math.hypot(c.cat.getBoundingClientRect().left - a.left, c.cat.getBoundingClientRect().top - a.top) }))
      .filter(n => n.distance < 620).sort((a, b) => a.distance - b.distance);
    const observer = nearby.find(n => Math.random() < n.c.cfg.curiosity);
    if (observer) { lastNotice = Date.now(); observer.c.notice(a.left + a.width / 2, kind); }
  }
  // Each cat owns its expression, timers, and animation instances.
  function initCat(cat) {
  const cfg = personalities[cat.id];
  const character = catConfig[cat.id];
  cat.querySelector('.cat-label').textContent = character.name;
  cat.setAttribute('aria-label', `${character.name}. ${cat.getAttribute('aria-label')} Hold or gently click three times to invite a belly roll.`);
  const sitting = cat.querySelector('svg');
  const belly = cat.querySelector('.belly-pose');
  let rolling = false, rollCooldown = 0, gentleClicks = [], gesture = null, pointerSample = null, lastLean = -Infinity;
  cat.style.setProperty('--wiggle', `${3 + character.playfulness * 12}deg`);
  cat.style.setProperty('--wiggle-speed', `${1.8 - character.playfulness * .8}s`);
  const body = cat.querySelector('.cat');
  body.style.animationDuration = `${cfg.breathe}s`;
  const pupils = cat.querySelector('.pupils');
  const outline = cat.querySelector('.ear-outline');
  const insides = cat.querySelector('.ear-insides');
  const blink = cat.querySelector('.blink');
  const bounce = cat.querySelector('.bounce');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let state = 'awake', hovered = false, pressing = false, suppressClick = false;
  let blinking, bouncing, heartAnimation;
  const timers = {};
  let lastStartle = -Infinity, lookingUntil = 0;
  function motion(amount = cfg.bounce) {
    if (reducedMotion.matches) return;
    bouncing?.cancel();
    bouncing = bounce.animate([{ transform: 'scale(1)' }, { transform: `scale(${1+amount}, ${1-amount})`, offset: .25 }, { transform: `scale(${1-amount*.6}, ${1+amount})`, offset: .6 }, { transform: 'scale(1)' }], { duration: cfg.speed, easing: 'ease-in-out' });
  }
  companions.push({ cat, cfg, available: () => !rolling && state === 'awake' && !pressing, notice(x, kind) {
    later('notice', () => {
      if (rolling || state !== 'awake' || pressing) return;
      const direction = Math.sign(x - (cat.getBoundingClientRect().left + 130));
      lookingUntil = Date.now() + 850;
      pupils.style.transform = `translate(${direction * cfg.eye}px, 0px)`;
      ears(direction * cfg.ear, 0);
      cat.style.setProperty('--tilt', `${direction * cfg.tilt * .6}deg`);
      if (kind === 'click' && cfg.role === 'timid') { setState('surprised'); later('expression', () => setState('awake'), 450); }
      if (kind === 'click' && cfg.role === 'bold') motion(cfg.bounce * .45);
      later('look', () => { pupils.style.transform = 'translate(0px, 0px)'; ears(); cat.style.setProperty('--tilt', '0deg'); }, 850);
    }, cfg.response);
  } });
  function later(name, fn, delay) {
    clearTimeout(timers[name]);
    timers[name] = setTimeout(fn, delay);
  }
  function setState(next) {
    clearTimeout(timers.expression);
    state = next;
    body.style.animationDuration = `${next === 'asleep' ? cfg.breathe * 1.5 : cfg.breathe}s`;
    if (next === 'asleep') notify(cat, 'sleep');
    cat.dataset.state = next;
    blinking?.cancel();
    if (next === 'asleep' || next === 'yawning') {
      pupils.style.transform = 'translate(0px, 0px)';
      ears();
    }
  }
  function activity() {
    if (rolling) return;
    if (state === 'asleep' || state === 'yawning') setState('awake');
    later('yawn', () => {
      if (pressing) return;
      setState('yawning');
      later('expression', () => setState('awake'), 1400);
    }, cfg.sleep - 3000);
    later('sleep', () => { if (!pressing) setState('asleep'); }, cfg.sleep);
  }
  function ears(dx = 0, dy = 0) {
    outline.setAttribute('d', `M76 105 Q70 82 ${77+dx} ${60+dy} Q${80+dx} ${54+dy} ${85+dx} ${59+dy} L109 80 Q130 74 151 80 L${175+dx} ${59-dy} Q${181+dx} ${54-dy} ${183+dx} ${63-dy} Q189 86 183 106 C200 149 176 171 131 172 C86 172 61 150 76 105Z`);
    insides.setAttribute('d', `M${81+dx} ${69+dy} L98 84 L80 94Z M${178+dx} ${69-dy} L161 84 L180 94Z`);
  }
  function doBlink() {
    if (!rolling && (state === 'awake' || state === 'surprised') && !reducedMotion.matches) {
      blinking?.cancel();
      blinking = blink.animate([
        { transform: 'scaleY(1)' },
        { transform: 'scaleY(.08)', offset: .45 },
        { transform: 'scaleY(1)' }
      ], { duration: hovered ? 150 : 240, easing: 'ease-in-out' });
    }
    later('blink', doBlink, cfg.blink + Math.random() * 1400);
  }
  cat.addEventListener('mouseenter', () => { hovered = true; activity(); doBlink(); });
  cat.addEventListener('mouseleave', () => { hovered = false; });
  function trackPointer(event) {
    if (gesture && gesture.id === event.pointerId && Math.hypot(event.clientX - gesture.x, event.clientY - gesture.y) > rollSettings.maxMovePx) {
      gesture = null; suppressClick = true; clearTimeout(timers.rollHold); release();
    }
    if (rolling) return;
    if (event.pointerType === 'touch' && !gesture) return;
    activity();
    const box = cat.getBoundingClientRect();
    const x = event.clientX - (box.left + box.width / 2);
    const y = event.clientY - (box.top + box.height * .43);
    const distance = Math.hypot(x, y) || 1;
    const now = performance.now();
    const fastApproach = pointerSample && distance < cfg.near && distance < pointerSample.distance && Math.hypot(event.clientX - pointerSample.x, event.clientY - pointerSample.y) / Math.max(1, now - pointerSample.time) > 1.2;
    pointerSample = { x: event.clientX, y: event.clientY, time: now, distance };
    if (cfg.role === 'timid' && fastApproach && now - lastLean > 3500) {
      lastLean = now;
      sitting.animate([{ transform: 'rotate(0)' }, { transform: `rotate(${-Math.sign(x) * 7}deg)`, offset: .4 }, { transform: 'rotate(0)' }], { duration: reducedMotion.matches ? 1 : 650 });
    }
    const amount = Math.min(distance / 65, 1);
    cat.style.setProperty('--tilt', `${distance < cfg.near ? x / cfg.near * cfg.tilt : 0}deg`);
    if (cfg.role === 'timid' && state === 'awake' && distance < cfg.near && !reducedMotion.matches) cat.style.setProperty('--tilt', `${-x / cfg.near * cfg.tilt}deg`);
    if (!pressing && distance < cfg.startle && Date.now() - lastStartle > 3500) {
      lastStartle = Date.now(); setState('surprised'); motion(.012);
      later('expression', () => setState('awake'), 400);
    }
    if (Date.now() < lookingUntil) return;
    ears(x / distance * cfg.ear * amount, y / distance * cfg.ear * .48 * amount);
    pupils.style.transform = `translate(${x / distance * cfg.eye * amount}px, ${y / distance * cfg.eye * .72 * amount}px)`;
    if (pressing && !overHead(event)) release();
  }
  document.addEventListener('pointermove', trackPointer);
  function overHead(event) {
    const head = cat.querySelector('.head').getBoundingClientRect();
    return event.clientX >= head.left && event.clientX <= head.right &&
      event.clientY >= head.top && event.clientY <= head.bottom;
  }
  let touchInput = false, lastTap = 0, tapStart = null;
  cat.addEventListener('pointerdown', event => {
    if (event.button !== 0 || !event.isPrimary || rolling) return;
    touchInput = event.pointerType === 'touch';
    tapStart = touchInput ? { x: event.clientX, y: event.clientY } : null;
    suppressClick = false;
    const wasSleeping = state === 'asleep' || state === 'yawning';
    activity();
    gesture = { id: event.pointerId, x: event.clientX, y: event.clientY };
    if (touchInput) { hovered = true; trackPointer(event); doBlink(); }
    if (!wasSleeping) later('rollHold', () => { if (gesture) { suppressClick = true; inviteRoll(); } }, rollSettings.holdMs);
    if (!overHead(event)) return;
    pressing = true;
    later('pet', () => { suppressClick = true; bouncing?.cancel(); setState('happy'); }, 450);
  });
  function release() {
    gesture = null; clearTimeout(timers.rollHold);
    if (!pressing) return;
    pressing = false;
    clearTimeout(timers.pet);
    activity();
    if (state === 'happy') later('expression', () => setState('awake'), 700);
  }
  document.addEventListener('pointerup', release);
  document.addEventListener('pointercancel', () => {
    if (touchInput) { suppressClick = true; lastTap = 0; tapStart = null; hovered = false; }
    release();
  });
  cat.addEventListener('pointerup', event => {
    if (touchInput) {
      hovered = false;
      if (tapStart && Math.hypot(event.clientX - tapStart.x, event.clientY - tapStart.y) > 12) { suppressClick = true; lastTap = 0; }
    }
  });
  window.addEventListener('blur', release);
  cat.addEventListener('contextmenu', event => event.preventDefault());
  cat.addEventListener('click', () => {
    if (rolling || suppressClick) { lastTap = 0; return; }
    const wasSleeping = state === 'asleep' || state === 'yawning';
    if (!wasSleeping) {
      character.trust = Math.min(1, character.trust + (cfg.role === 'timid' ? .015 : .005));
      gentleClicks = gentleClicks.filter(t => Date.now() - t < rollSettings.clickWindowMs);
      gentleClicks.push(Date.now());
    }
    if (touchInput) {
      const now = Date.now();
      if (lastTap && now - lastTap < 350) { lastTap = 0; affection(); return; }
      lastTap = now;
    }
    activity();
    setState(cfg.role === 'bold' || cfg.role === 'curious' ? 'happy' : 'surprised');
    motion();
    notify(cat, 'click');
    if (!wasSleeping) {
      if (gentleClicks.length >= rollSettings.clicks) later('invite', inviteRoll, 380);
    }
    later('expression', () => setState('awake'), cfg.role === 'timid' ? 550 : 850);
  });
  cat.addEventListener('dblclick', () => { if (!touchInput) affection(); });
  function affection() {
    if (rolling || suppressClick) return;
    clearTimeout(timers.invite);
    activity();
    setState('awake');
    bouncing?.cancel();
    heartAnimation?.cancel();
    heartAnimation = cat.querySelector('.heart').animate([
      { opacity: 0, transform: 'translateY(5px) scale(.8)' },
      { opacity: 1, transform: 'translateY(0) scale(1)', offset: .2 },
      { opacity: 0, transform: `translateY(${reducedMotion.matches ? 0 : -25}px) scale(1)` }
    ], { duration: 1400, easing: 'ease-out' });
  }
  function inviteRoll() {
    if (rolling || state === 'asleep' || state === 'yawning' || Date.now() < rollCooldown) return;
    gentleClicks = [];
    character.interactionCount++;
    character.trust = Math.min(1, character.trust + (cfg.role === 'timid' ? .09 : .04));
    rollCooldown = Date.now() + rollSettings.cooldownMs;
    const chance = character.bellyRollChance * (.55 + character.trust * .45);
    if (Math.random() > chance) {
      setState('happy');
      later('expression', () => setState('awake'), 700);
      return;
    }
    roll();
  }
  async function roll() {
    rolling = true;
    cat.dataset.rolling = 'true';
    pressing = false; gesture = null; suppressClick = true;
    Object.values(timers).forEach(clearTimeout);
    blinking?.cancel(); bouncing?.cancel(); heartAnimation?.cancel();
    setState('awake'); ears(); pupils.style.transform = 'translate(0, 0)';
    cat.style.setProperty('--tilt', '0deg');
    const duration = reducedMotion.matches ? 1 : 1050 + (1 - character.boldness) * 400;
    const direction = cat.id === 'cat-2' ? -1 : 1;
    const frames = [
      { transform: 'rotate(0deg)', opacity: 1 },
      { transform: `rotate(${direction * -6}deg)`, opacity: 1, offset: .22 },
      { transform: `translateY(8px) rotate(${direction * 35}deg)`, opacity: 1, offset: .55 },
      { transform: `translateY(12px) rotate(${direction * 95}deg) scale(.93)`, opacity: 0 }
    ];
    const bellyFrames = [
      { transform: `rotate(${direction * -85}deg) scale(.93)`, opacity: 0 },
      { transform: `rotate(${direction * -65}deg) scale(.96)`, opacity: 0, offset: .5 },
      { transform: `rotate(${direction * 8}deg)`, opacity: 1, offset: .87 },
      { transform: 'rotate(0deg)', opacity: 1 }
    ];
    const animate = async (reverse = false) => {
      const options = { duration, easing: 'ease-in-out', fill: 'forwards', direction: reverse ? 'reverse' : 'normal' };
      const animations = [sitting.animate(frames, options), belly.animate(bellyFrames, options)];
      await Promise.all(animations.map(a => a.finished));
      sitting.style.opacity = reverse ? '1' : '0';
      belly.style.opacity = reverse ? '0' : '1';
      animations.forEach(a => a.cancel());
    };
    try {
      await animate();
      cat.dataset.pose = 'belly';
      await new Promise(resolve => setTimeout(resolve, rollSettings.stayMs + character.playfulness * 1400));
      delete cat.dataset.pose;
      await animate(true);
    } finally {
      sitting.style.opacity = '1'; belly.style.opacity = '0';
      rolling = false; delete cat.dataset.rolling; delete cat.dataset.pose;
      suppressClick = false; rollCooldown = Date.now() + rollSettings.cooldownMs;
      setState('awake'); activity(); later('blink', doBlink, cfg.blink);
    }
  }
  setState('awake');
  activity();
  later('blink', doBlink, cfg.blink + Math.random() * 900);
  }
  document.querySelectorAll('.cats > button').forEach(initCat);
</script>
</html>
