<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little cat</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 42%, #fffcf6, #eee8de); }
  button { position: relative; width: 260px; height: 290px; padding: 0; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 1px solid #b9ac99; outline-offset: 12px; border-radius: 45%; }
  svg { width: 100%; height: 100%; overflow: visible; }
  .cat { transform-origin: 130px 248px; animation: breathe 4s ease-in-out infinite; }
  .head { transform: rotate(var(--tilt, 0deg)); transform-origin: 130px 151px; transition: transform .45s cubic-bezier(.2,.7,.3,1.3); }
  .eyes { transform-origin: 130px 125px; transition: transform .25s ease, opacity .2s; }
  .bounce { transform-origin: 130px 248px; }
  .blink { transform-origin: 130px 125px; }
  .ear-outline, .ear-insides { transition: d .3s ease-out; }
  .pupils { transition: transform .12s ease-out; }
  .sleep-eyes, .happy-eyes, .mouth-oh { opacity: 0; transition: opacity .2s; }
  .mouth { transition: opacity .2s; }
  [data-state="surprised"] .head { transform: translateY(-5px) rotate(-3deg); }
  [data-state="surprised"] .eyes { transform: scaleY(1.35); }
  [data-state="surprised"] .mouth { opacity: 0; }
  [data-state="surprised"] .mouth-oh { opacity: 1; }
  [data-state="asleep"] .cat { animation-duration: 6s; }
  [data-state="asleep"] .head { transform: translateY(5px) rotate(4deg); }
  [data-state="asleep"] .eyes { transform: scaleY(.05); opacity: 0; }
  [data-state="asleep"] .sleep-eyes { opacity: 1; }
  [data-state="happy"] .head { transform: translateY(-2px) rotate(-4deg); }
  [data-state="happy"] .eyes, [data-state="yawning"] .eyes { opacity: 0; }
  [data-state="happy"] .happy-eyes, [data-state="yawning"] .sleep-eyes { opacity: 1; }
  [data-state="yawning"] .head { transform: translateY(-3px) rotate(2deg); }
  [data-state="yawning"] .mouth { opacity: 0; }
  [data-state="yawning"] .mouth-oh { opacity: 1; transform: scale(1.6, 2.4); }
  .mouth-oh { transform-origin: 130px 148px; transition: transform .5s ease, opacity .25s; }
  .happy-eyes { transition: opacity .25s; }
  button { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .zzz { opacity: 0; fill: #a79d90; font: 15px Georgia, serif; letter-spacing: 3px; }
  [data-state="asleep"] .zzz { animation: drift 3s ease-in-out infinite; }
  .heart { opacity: 0; transform-origin: 193px 67px; fill: #d59c9a; }
  @keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.012,1.025); } }
  @keyframes drift { 0%,100% { opacity: 0; transform: translateY(3px); } 35%,65% { opacity: .8; } 90% { transform: translateY(-13px); } }
  @media (prefers-reduced-motion: reduce) { .cat { animation: none; } .head, .eyes, .pupils, .ear-outline, .ear-insides { transition: none; } }
  .cats { display: flex; align-items: center; justify-content: center; gap: 24px; }
  .cats > button { flex-shrink: 0; }
  @media (max-width: 1150px) { .cats { display: grid; grid-template-columns: repeat(2, 260px); gap: 0 24px; } }
  @media (max-width: 560px) { .cats { grid-template-columns: 260px; gap: 0; } }

  .cat-label { display: block; position: absolute; top: 276px; width: 100%; color: #9a8c7b; font: 10px/1.5 Georgia, serif; letter-spacing: .15em; pointer-events: none; }
  button > svg { position: absolute; inset: 0; transform-origin: 50% 76%; }
  .belly-pose > g { transform: rotate(-16deg); transform-origin: 130px 178px; }
  button > .belly-pose { opacity: 0; pointer-events: none; }
  button[data-rolling="true"] .cat { animation-play-state: paused; }
  .belly-paw { transform-box: fill-box; transform-origin: center; }
  .belly-tail { transform-origin: 167px 196px; }
  [data-pose="belly"] .belly-paw { animation: paw-wiggle var(--wiggle-speed, 1.2s) ease-in-out infinite alternate; }
  [data-pose="belly"] .belly-tail { animation: tail-wiggle 1.5s ease-in-out infinite alternate; }
  @keyframes paw-wiggle { to { transform: rotate(var(--wiggle, 8deg)) translateY(-2px); } }
  @keyframes tail-wiggle { to { transform: rotate(var(--wiggle, 8deg)); } }
  @media (prefers-reduced-motion: reduce) { .belly-paw, .belly-tail { animation: none !important; } }
  /* Extra poses reuse the current illustrations; sitting SVG source stays intact. */
  button > svg { transition: opacity .65s ease, transform .65s ease; }
  button > .stand-pose, button > .sleep-pose, button > .grooming-detail { opacity: 0; pointer-events: none; }
  .stand-pose > g { transform-origin: 130px 242px; }
  [data-mode="standing"] > svg:first-child { opacity: 0; transform: translateY(-6px) scale(.98); }
  [data-mode="standing"] > .stand-pose { opacity: 1; }
  [data-mode="standing"] > .stand-pose > g { transform: scaleY(var(--stand-stretch)); }
  [data-mode="standing"] .cat, [data-mode="grooming"] .cat { animation-play-state: paused; }
  [data-mode="grooming"] > .grooming-detail { opacity: 1; }
  [data-mode="grooming"] .head, [data-mode="grooming"] .grooming-detail > g { animation: groom-nod .65s ease-in-out 4; }
  @keyframes groom-nod { 0%,100% { transform: rotate(9deg) translateY(2px); } 50% { transform: rotate(16deg) translateY(5px); } }
  .grooming-detail > g { transform-origin: 130px 151px; }
  [data-sleep-pose] > svg:first-child { opacity: 0; }
  [data-sleep-pose="curled"] > [data-sleep-art="curled"],
  [data-sleep-pose="side"] > [data-sleep-art="side"],
  [data-sleep-pose="paws"] > [data-sleep-art="paws"],
  [data-sleep-pose="belly"] > [data-sleep-art="belly"],
  [data-sleep-pose="halfSide"] > [data-sleep-art="halfSide"] { opacity: 1; }
  .sleep-pose .eyes, .sleep-pose .happy-eyes, .sleep-pose .mouth-oh { opacity: 0; }
  .sleep-pose .sleep-eyes { opacity: 1; }
  .sleep-breath { transform-origin: 130px 246px; }
  [data-state="asleep"] > .sleep-pose .sleep-breath { animation: sleep-breathe 7s ease-in-out infinite; }
  .sleep-tail { transform-box: fill-box; transform-origin: center; }
  [data-state="asleep"] > .sleep-pose .sleep-tail { animation: sleep-twitch 19s ease-in-out infinite; }
  @keyframes sleep-breathe { 50% { transform: scale(1.003, 1.012); } }
  @keyframes sleep-twitch { 0%,91%,96%,100% { transform: rotate(0); } 93% { transform: rotate(1.5deg); } }
  @media (prefers-reduced-motion: reduce) {
    button > svg { transition-duration: .01s; }
    [data-mode="grooming"] .head, [data-mode="grooming"] .grooming-detail > g { animation: none; }
    .sleep-pose .sleep-breath, .sleep-pose .sleep-tail { animation: none !important; }
  }

  /* One small toy, outside the layout and all existing cat artwork. */
  #yarn-ball { position: fixed; width: 34px; height: 34px; pointer-events: auto; touch-action: none; cursor: grab; z-index: 2; transform: translate(-50%, -50%); }
  #yarn-ball[hidden] { display: none; }
  [data-mode="toy"] .cat { animation-play-state: paused; }
  /* Petting reuses the sitting face; no extra cat artwork. */
  [data-mode="petting"] .cat { animation-play-state: paused; }
  [data-petting] > svg:first-child .eyes { transition: transform .8s ease, opacity .8s ease; }
  [data-petting] > svg:first-child .happy-eyes { transition: opacity .8s ease; }
  [data-petting="relaxed"] > svg:first-child .eyes { transform: scaleY(.08); opacity: 0; }
  [data-petting="relaxed"] > svg:first-child .happy-eyes { opacity: var(--pet-happy, .75); }
  [data-petting="relaxed"] > svg:first-child .head { transform: translateY(var(--pet-lower, 2px)) rotate(1deg); transition-duration: .8s; }
  [data-petting="relaxed"] > svg:first-child .bounce { animation: pet-purr .28s ease-in-out infinite; }
  @keyframes pet-purr { 0%,100% { transform: translateY(0); } 50% { transform: translateY(var(--pet-purr, .2px)); } }
  @media (prefers-reduced-motion: reduce) {
    [data-petting] > svg:first-child .bounce { animation: none; }
    [data-petting] > svg:first-child .head, [data-petting] > svg:first-child .eyes, [data-petting] > svg:first-child .happy-eyes { transition-duration: .01s; }
  }
  #yarn-ball:active { cursor: grabbing; }
  #yarn-ball:focus-visible { outline: 1px solid #b9ac99; outline-offset: 4px; border-radius: 50%; }
  button > .toy-paw-detail { pointer-events: none; opacity: 0; transition: opacity .15s; }
  [data-toy-paw] > .toy-paw-detail { opacity: 1; }
</style>
